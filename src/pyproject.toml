[project]
name = "snli-hierarchical-classification"
version = "0.1.0"
description = "Final project for AI388 NLP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[tool.uv.sources]
torch = [
    { index = "pypi", marker = "platform_machine == 'arm64'" },
    { index = "pytorch-cu130", marker = "platform_machine != 'arm64'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
include_trailing_comma = true
lines_after_imports = 2
